version: "3.8"

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: stories
      POSTGRES_USER: ashish
      POSTGRES_PASSWORD: ashish
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashish -d stories"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=your-secret-key-here-change-this-in-production
      - POSTGRES_DB=stories
      - POSTGRES_USER=ashish
      - POSTGRES_PASSWORD=ashish
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_STORAGE_BUCKET_NAME=stories-media
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    command: >
      sh -c "python stories_service/manage.py migrate &&
             python stories_service/manage.py runserver 0.0.0.0:8000"

  worker:
    build: .
    environment:
      - DEBUG=True
      - SECRET_KEY=your-secret-key-here-change-this-in-production
      - POSTGRES_DB=stories
      - POSTGRES_USER=ashish
      - POSTGRES_PASSWORD=ashish
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    command: python stories_service/manage.py expire_stories --interval 60

volumes:
  postgres_data:
  minio_data:
