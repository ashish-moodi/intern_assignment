apiVersion: v1
kind: ConfigMap
metadata:
  name: stories-config
  namespace: stories-api
data:
  DEBUG: "False"
  POSTGRES_DB: "stories"
  POSTGRES_USER: "stories_user"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  REDIS_URL: "redis://redis-service:6379/1"
  AWS_S3_ENDPOINT_URL: "http://minio-service:9000"
  AWS_STORAGE_BUCKET_NAME: "stories-media"
  AWS_S3_REGION_NAME: "us-east-1"
  ALLOWED_HOSTS: "localhost,127.0.0.1"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
